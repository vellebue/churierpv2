services:
# MAIN DB
  churierpv2-db:
    image: postgres:17.5
    volumes:
      - churierpv2-db-volume:/var/lib/postgresql/data
    ports:
      - 7969:5432
    expose:
      - "5432"
    environment:
      POSTGRES_DB: "churierpv2"
      POSTGRES_USER: "churierp"
      POSTGRES_PASSWORD: "angel7"
    networks:
      - churierpv2-net
# KEYCLOAK
  churierpv2-keycloak-db:
    image: postgres:17.5
    volumes:
      - churierpv2-keycloak-db-volume:/var/lib/postgresql/data
    ports:
      - 8969:5432
    expose:
      - "5432"
    environment:
      POSTGRES_DB: "keycloakdb"
      POSTGRES_USER: "keycloak"
      POSTGRES_PASSWORD: "angel7"
    networks:
      - churierpv2-net
  churierpv2-keycloak:
    image: bitnami/keycloak:23.0.6
    environment:
      KEYCLOAK_DATABASE_VENDOR: postgresql
      KEYCLOAK_DATABASE_HOST: churierpv2-keycloak-db
      KEYCLOAK_DATABASE_NAME: keycloakdb
      KEYCLOAK_DATABASE_USER: keycloak
      KEYCLOAK_DATABASE_SCHEMA: public
      KEYCLOAK_DATABASE_PASSWORD: angel7
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Pa55w0rd
  #    KC_HTTP_RELATIVE_PATH: /auth
  #    KEYCLOAK_LOG_LEVEL: debug
  #    KEYCLOAK_ROOT_LOG_LEVEL: DEBUG
    ports:
      - 8000:8080
    expose:
      - "8080"
    depends_on:
      - churierpv2-keycloak-db
    networks:
      - churierpv2-net
# OLLAMA ENGINE
  churierpv2-ollama:
    image: ollama/ollama:0.17.7
    #use nvidia-smi -L to list available GPUs and id numbers
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0']
              capabilities: [ gpu ]
    #environment:
    #  CUDA_VISIBLE_DEVICES: "GPU-22371b8b-7854-5181-7084-f92ad0ec80c6"
    #user: angel
    volumes:
      - churierpv2-ollama-volume:/root/.ollama
    ports:
      - 11435:11434
    expose:
      - "11434"
    #command: "ollama run llama3.2-vision"
    networks:
      - churierpv2-net
volumes:
  churierpv2-db-volume:
  churierpv2-keycloak-db-volume:
  churierpv2-ollama-volume:
networks:
  churierpv2-net:
    driver: bridge